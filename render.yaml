# Render (render.com) kurulum tarifi: beslenme planı sunucusu.
# Render'da "New > Blueprint" ile bu depo seçilince servis buradaki ayarlarla kurulur.
services:
  - type: web
    name: indirim-takip-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /saglik
    # Bot her gün data/ altına commit atıyor; sunucu yalnızca kod değişince yeniden kurulsun.
    # (Güncel katalog KATALOG_URL'den, çalışırken indirilir.)
    buildFilter:
      paths:
        - api/**
        - beslenme/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Ücretsiz planın işlemcisi zayıf: iyi bir plan için çözücüye daha uzun süre tanı
      - key: PLAN_SURE_SINIRI
        value: "110"
      - key: KATALOG_URL
        value: https://samet1636.github.io/indirim-takip/data/katalog.json
      # Hesap + haftalık ücretsiz plan hakkı (api/hesap.py). Publishable anahtar herkese açıktır;
      # sunucu gizli anahtar kullanmaz, istekleri kullanıcının kendi oturumuyla yapar.
      - key: SUPABASE_URL
        value: https://ldzjsmxzhmmlgbwpkaxj.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_NoiXH_rygiBolrj-Vp39mA_8r1RrwYE
      - key: HAFTALIK_PLAN
        value: "1"
