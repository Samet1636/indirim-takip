name: Günlük indirim taraması

on:
  schedule:
    - cron: "0 4 * * *"      # her gün 04:00 UTC = 07:00 Türkiye
  workflow_dispatch:          # Actions sekmesinden elle de çalıştırılabilsin
  push:                       # bilgisayardan A101 sonucu gelince siteyi hemen güncelle
    paths:
      - "data/imports/**"

permissions:
  contents: write             # sonuçları repoya kaydetmek için
  pages: write                # siteyi yayınlamak için
  id-token: write

concurrency:
  group: tarama
  cancel-in-progress: false

jobs:
  # 1) Tarama, kaydetme ve site dosyalarını hazırlama
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # A101 burada taranmıyor (Cloudflare GitHub sunucularını engelliyor); bilgisayardan
      # gelen data/imports/a101.json dosyası içe aktarılıyor.
      - name: Marketleri tara
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python run.py --no-scrape --import-dir data/imports
          else
            python run.py --skip a101 --katalog --import-dir data/imports
          fi
        continue-on-error: true   # bir market hata verse de eldeki veriyle devam et

      - name: Sonuçları repoya kaydet
        run: |
          git config user.name "indirim-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prices.db data/discounts_today.json data/katalog.json
          git commit -m "Günlük tarama $(date -u +%F)" || echo "Değişiklik yok"
          git pull --rebase
          git push

      - name: Site dosyalarını hazırla
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/discounts_today.json data/katalog.json _site/data/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # 2) Yayınlama ayrı iş: hata verirse sadece bu kısım ("Re-run failed jobs") birkaç saniyede
  #    tekrar çalıştırılabilir, 40 dakikalık tarama baştan yapılmaz.
  yayinla:
    needs: tara
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
